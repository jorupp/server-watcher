<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Server Watcher</title>
  <link rel="stylesheet" href="shared/cards.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ──────────────────────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 18px;
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      flex-shrink: 0;
      -webkit-app-region: drag;
      gap: 14px;
    }
    header * { -webkit-app-region: no-drag; }

    .app-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.3px;
      color: #0f172a;
      flex-shrink: 0;
    }

    .header-center {
      display: flex;
      align-items: center;
      gap: 16px;
      flex: 1;
    }

    #summary { font-size: 13px; color: #64748b; }
    #summary .count-online { color: #16a34a; font-weight: 600; }

    #poll-label { font-size: 12px; color: #94a3b8; }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      color: #475569;
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
      white-space: nowrap;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .btn:hover:not(:disabled) { background: #e2e8f0; color: #1e293b; border-color: #cbd5e1; }
    .btn:disabled { opacity: 0.45; cursor: default; }

    .btn-primary {
      background: #f0fdf4;
      border-color: #bbf7d0;
      color: #16a34a;
    }
    .btn-primary:hover:not(:disabled) {
      background: #dcfce7;
      border-color: #86efac;
      color: #15803d;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spinning::before {
      content: '';
      display: inline-block;
      width: 10px;
      height: 10px;
      border: 2px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-right: 6px;
      vertical-align: middle;
    }

    /* ── Scroll area ─────────────────────────────────────────────────────── */
    main {
      flex: 1;
      overflow-y: auto;
      padding: 16px 18px;
    }
    main::-webkit-scrollbar       { width: 7px; }
    main::-webkit-scrollbar-track { background: transparent; }
    main::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

    /* ── Server list ─────────────────────────────────────────────────────── */
    #servers-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* ── State blocks ────────────────────────────────────────────────────── */
    .state-block {
      text-align: center;
      color: #94a3b8;
      padding: 60px 20px;
    }
    .state-block h2 { font-size: 17px; color: #64748b; margin-bottom: 8px; }
    .state-block p  { font-size: 13px; line-height: 1.6; }
    .state-block code {
      background: #e2e8f0;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 12px;
      color: #7c3aed;
    }

    .error-block {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 10px;
      padding: 16px 20px;
      color: #b91c1c;
    }
    .error-block strong { display: block; margin-bottom: 6px; font-size: 13px; color: #991b1b; }
    .error-block pre {
      font-size: 12px;
      color: #dc2626;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: 'Cascadia Mono', 'Consolas', monospace;
    }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.4} }
    .blink { animation: blink 1.6s ease-in-out infinite; }

    #web-link, #metrics-link {
      font-size: 12px;
      color: #94a3b8;
      text-decoration: none;
      border-bottom: 1px dotted #cbd5e1;
    }
    #web-link:hover, #metrics-link:hover { color: #2563eb; border-bottom-color: #93c5fd; }
    #web-link:empty, #metrics-link:empty { display: none; }
    #web-link.web-error, #metrics-link.web-error {
      color: #dc2626;
      border-bottom: none;
      cursor: default;
    }
  </style>
</head>
<body>
  <header>
    <span class="app-title">Server Watcher</span>
    <div class="header-center">
      <span id="summary"></span>
      <span id="poll-label"></span>
      <a id="web-link" href="#" title="Open the web dashboard in your browser"></a>
      <a id="metrics-link" href="#" title="Prometheus scrape endpoint"></a>
    </div>
    <div class="header-actions">
      <button class="btn btn-primary" id="refresh-btn">Refresh</button>
      <button class="btn" id="test-notify-btn">Test Notification</button>
      <button class="btn" id="reload-btn">Reload Config</button>
    </div>
  </header>
  <main>
    <div id="servers-list">
      <div class="state-block">
        <p class="blink">Querying servers&hellip;</p>
      </div>
    </div>
  </main>
  <script src="shared/render.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
