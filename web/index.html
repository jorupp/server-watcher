<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Server Watcher</title>
  <link rel="stylesheet" href="/shared/cards.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
      min-height: 100vh;
      -webkit-text-size-adjust: 100%;
    }

    /* ── Header ──────────────────────────────────────────────────────────── */
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      padding: 10px 14px;
      padding-top: calc(10px + env(safe-area-inset-top));
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .app-title {
      font-size: 15px;
      font-weight: 700;
      color: #0f172a;
      flex-shrink: 0;
    }

    .header-meta {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 1px;
      min-width: 0;
    }

    #summary { font-size: 13px; color: #64748b; white-space: nowrap; }
    #summary .count-online { color: #16a34a; font-weight: 600; }

    #status-line {
      font-size: 11px;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }
    #status-line.stale { color: #dc2626; font-weight: 600; }

    main {
      padding: 12px;
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 780px;
      margin: 0 auto;
    }

    .state-block {
      text-align: center;
      color: #94a3b8;
      padding: 48px 16px;
      font-size: 14px;
    }
    .state-block h2 { font-size: 16px; color: #64748b; margin-bottom: 6px; }

    .offline-banner {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 10px;
      padding: 12px 14px;
      color: #b91c1c;
      font-size: 13px;
      line-height: 1.5;
    }
    .offline-banner strong { display: block; margin-bottom: 3px; }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.4} }
    .blink { animation: blink 1.6s ease-in-out infinite; }

    /* ── Touch-friendly tweaks for phones ────────────────────────────────── */
    @media (max-width: 560px) {
      .card-body { padding: 12px 14px 11px; }
      .server-label { font-size: 15px; }
      .card-sub, .players-section, .status-note,
      .error-details, .history-details { padding-left: 0; }
      .card-sub-name { max-width: 100%; }
      .chip { font-size: 13px; padding: 4px 10px; }
      .no-players-note { font-size: 13px; }
      .player-badge { font-size: 13px; padding: 3px 10px; }
      .history-details > summary,
      .error-details summary { padding: 6px 0; }
      .history-row { padding: 4px 0; }
      /* The desktop palette is too faint to read on a phone in daylight. */
      .history-name { font-size: 13px; color: #64748b; }
      .history-time { font-size: 12px; color: #94a3b8; }
      .history-joined { color: #cbd5e1; }
      /* Stack the name and its times instead of squeezing them together. */
      .history-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 0;
      }
      .history-times { align-items: flex-start; flex-direction: row; gap: 8px; }
      .card-footer { font-size: 12px; color: #94a3b8; }
    }
  </style>
</head>
<body>
  <header>
    <span class="app-title">Server Watcher</span>
    <div class="header-meta">
      <span id="summary"></span>
      <span id="status-line">connecting…</span>
    </div>
  </header>
  <main id="servers-list">
    <div class="state-block">
      <p class="blink">Loading&hellip;</p>
    </div>
  </main>
  <script src="/shared/render.js"></script>
  <script src="/web/app.js"></script>
</body>
</html>
