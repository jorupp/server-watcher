# rename to servers.yaml and fill in your server details to get started
# ---------------------------------------------------------------------------
# Server Watcher — Configuration
# ---------------------------------------------------------------------------
# poll_interval: seconds between queries for each server (minimum: 5)
poll_interval: 30

# notification_sound: path to a .wav file to play when a player joins.
# Defaults to the Windows system notification sound if omitted.
# Example:
# notification_sound: "C:\Windows\Media\Windows Notify Email.wav"

# web_port: port for the read-only web dashboard, reachable from your phone at
# http://<this-machine>:<port>/ . Set to false to turn the dashboard off.
web_port: 3030

# metrics_port: port for the Prometheus scrape endpoint at
# http://<this-machine>:<port>/metrics . Set to false to turn it off.
metrics_port: 3031

# metrics_player_window_hours: how long a player keeps reporting a 0 in the
# metrics after logging off. Without this their series would vanish, and the
# per-player Grafana timeline would draw a gap instead of a "not playing" line.
metrics_player_window_hours: 24

# self_reminder_minutes: how often to re-notify you when a server with a `self`
# player has people on it and you're not among them. Set to false to disable.
self_reminder_minutes: 10

# servers: list of game servers to monitor
#
# Required fields:
#   host  — IP address or hostname
#   type  — game identifier (see list below)
#
# Optional fields:
#   port               — query/status port (default: 27015 for most Steam games);
#                        for Factorio, the UDP game port (default: 34197)
#   joinPort           — game port to connect on, if different from the query port
#   label              — friendly display name shown in the UI
#   password           — stored here for your reference; not used for querying
#   notification_sound — .wav file to play for this server (overrides global setting)
#   enabled            — false to stop watching this server (default: true). It stays
#                        in the list as a greyed-out line and isn't polled or counted.
#   self               — your own in-game name on this server. While you're on the
#                        server, other players' join notifications are muted; you
#                        still get alerts when you join or leave. If others are
#                        playing and you're not, you get a reminder every
#                        `self_reminder_minutes` listing who's on.
#
# If you don't know the gamedig `type` for your game, you can use:
#   type: steam
#   appid: <Steam App ID>
# and gamedig will handle the rest.
#
# Common type values:
#   CS2 / CS:GO     → csgo
#   Team Fortress 2 → tf2
#   Garry's Mod     → garrysmod
#   ARK             → arkse
#   Rust            → rust
#   Valheim         → valheim
#   Left 4 Dead 2   → left4dead2
#   7 Days to Die   → 7daystodie
#   Killing Floor 2 → killingfloor2
#   Squad           → squad
#   ARMA 3          → arma3
#   Minecraft       → minecraft
#   Factorio        → factorio
#
#   Full list: https://github.com/gamedig/node-gamedig#games-list
# ---------------------------------------------------------------------------

servers:

# Uncomment and fill in as needed:
